<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apps">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iOS shows this while the standalone app boots. Your screenshot is already the exact device size. -->
  <link rel="apple-touch-startup-image" href="assets/home.png">
  <link rel="preload" as="image" href="assets/home.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Apps</title>
</head>
<body>
  <div id="app">

    <!-- ============ SCREEN 1 : App Library ============ -->
    <section id="home" class="screen">
      <img id="home-img" class="fullimg" src="assets/home.png" alt="" draggable="false">
      <!-- Covers the status bar frozen in the screenshot; the live iOS status bar draws on top. -->
      <div id="sb-cover"><img id="wall-img" class="fullimg" src="assets/wallpaper.png" alt="" draggable="false"><canvas id="wall-fallback" class="fullimg" hidden></canvas></div>
      <div id="zones"></div>
      <div id="home-missing" hidden>assets/home.png introuvable</div>
      <div id="home-debug" class="debug-badge" hidden></div>
      <div id="zone-bar" class="tool-bar" hidden>
        <button data-z="add">+ Zone</button>
        <button data-z="del">Supprimer</button>
        <button data-z="cam">= Caméra</button>
        <button data-z="reset">Défaut</button>
        <button data-z="done" class="primary">OK</button>
      </div>
    </section>

    <!-- ============ SCREEN 2 : Camera (selfie) ============ -->
    <section id="camera" class="screen" hidden>
      <div id="cam-root">
        <!-- top: format pill + controls pill (iOS 26) -->
        <div class="cam-pill" id="cam-heif"><span class="heif">HEIF</span><span class="mp">24</span></div>
        <div class="cam-pill" id="cam-ctrls" aria-hidden="true">
          <!-- glyphs are drawn as in camera_ref.png (phone sideways) and rotated by --glyph-rot -->
          <svg class="rg" style="left:18.3px" viewBox="0 0 70 70"><mask id="moonm"><rect width="70" height="70" fill="#fff"/><circle cx="24" cy="19" r="19" fill="#000"/></mask><circle cx="34" cy="30" r="22" fill="#f8d748" mask="url(#moonm)"/><text x="0" y="0" transform="translate(23 21) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="600" fill="#f8d748" font-family="-apple-system,system-ui,sans-serif">3</text></svg>
          <svg class="rg" style="left:53.3px" viewBox="0 0 70 70"><g transform="rotate(-90 35 35)"><path d="M38 12 22 37h11l-3 21 17-27H36z" fill="#fff"/></g><path d="M16 52 52 17" stroke="#1e1f1f" stroke-width="8"/><path d="M16 52 52 17" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
          <svg class="rg" style="left:88.3px" viewBox="0 0 70 70"><circle cx="34" cy="35" r="24" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="0.1 4.1" stroke-linecap="round"/><circle cx="34" cy="35" r="16" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="34" cy="35" r="8" fill="#fff"/><path d="M13 56 55 13" stroke="#1e1f1f" stroke-width="8"/><path d="M13 56 55 13" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>
          <svg class="rg" style="left:123.3px" viewBox="0 0 70 70"><g fill="#fff"><circle cx="26" cy="18" r="5"/><circle cx="43" cy="18" r="5"/><circle cx="26" cy="35" r="5"/><circle cx="43" cy="35" r="5"/><circle cx="26" cy="52" r="5"/><circle cx="43" cy="52" r="5"/></g></svg>
        </div>

        <div id="preview">
          <video id="video" playsinline muted autoplay disablepictureinpicture></video>
          <div id="overlay-fx">
            <div id="card-el"><canvas id="card-canvas"></canvas><div class="grain"></div></div>
          </div>
          <svg id="dbg-svg" hidden></svg>
          <div id="dbg-text" class="debug-badge" hidden></div>
          <div id="focus-box" hidden><i class="fb-sun"></i></div>
          <div id="ae-lock" hidden>VERROUILLAGE AE/AF</div>
          <div id="cam-grid"><i></i><i></i><i></i><i></i></div>
          <div id="cam-zoom" aria-hidden="true"><span>1,4×</span></div>
          <div id="cam-zoom2" aria-hidden="true"><span>2</span></div>
          <div id="shutter-flash"></div>
          <div id="cam-denied" hidden></div>
        </div>

        <div id="cam-shutter"><i></i></div>
        <div id="cam-thumb"><canvas id="thumb-canvas" width="144" height="144"></canvas></div>
        <div id="cam-modes"><b class="sel"></b><span class="m-video">VIDÉO</span><span class="m-photo">PHOTO</span></div>
        <div id="cam-flip">
          <svg class="rg" viewBox="0 0 70 70"><g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"><path d="M17.3 52.4A27 27 0 0 1 33 8.1"/><path d="M52.7 17.6A27 27 0 0 1 37 61.9"/></g><path d="M41.5 8.3 31.5 1.5v13.6z" fill="#fff"/><path d="M28.5 61.7 38.5 68.5V54.9z" fill="#fff"/></svg>
        </div>

        <img id="cam-ref" src="assets/camera_ref.png" alt="" draggable="false" hidden>
        <div id="launch-icon"><img alt="" draggable="false"></div>
      </div>

      <div id="calib-bar" class="tool-bar" hidden>
        <button data-c="ghost">Opacité</button>
        <button data-c="reset">Défaut</button>
        <button data-c="cancel">Annuler</button>
        <button data-c="save" class="primary">Enregistrer</button>
      </div>
      <div id="calib-help" hidden>1 doigt : déplacer · 2 doigts : taille + rotation</div>
    </section>

    <!-- ============ Secret settings ============ -->
    <section id="settings" hidden></section>
  </div>

  <video id="keepawake" src="media/keepawake.mp4" playsinline muted loop hidden></video>
  <script type="module" src="js/app.js"></script>
</body>
</html>
