<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apps">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- iOS shows this while the standalone app boots. Your screenshot is already the exact device size. -->
  <link rel="apple-touch-startup-image" href="assets/home.png">
  <link rel="preload" as="image" href="assets/home.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Apps</title>
</head>
<body>
  <div id="app">

    <!-- ============ SCREEN 1 : App Library ============ -->
    <section id="home" class="screen">
      <img id="home-img" class="fullimg" src="assets/home.png" alt="" draggable="false">
      <!-- Covers the status bar frozen in the screenshot; the live iOS status bar draws on top. -->
      <div id="sb-cover"><img id="wall-img" class="fullimg" src="assets/wallpaper.png" alt="" draggable="false"><canvas id="wall-fallback" class="fullimg" hidden></canvas></div>
      <div id="zones"></div>
      <div id="home-missing" hidden>assets/home.png introuvable</div>
      <div id="home-debug" class="debug-badge" hidden></div>
      <div id="zone-bar" class="tool-bar" hidden>
        <button data-z="add">+ Zone</button>
        <button data-z="del">Supprimer</button>
        <button data-z="cam">= Caméra</button>
        <button data-z="reset">Défaut</button>
        <button data-z="done" class="primary">OK</button>
      </div>
    </section>

    <!-- ============ SCREEN 2 : Camera (selfie) ============ -->
    <section id="camera" class="screen" hidden>
      <div id="cam-root">
        <div class="cam-top">
          <div class="cam-ico" id="cam-flash" aria-hidden="true">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M17.6 7.5 10.8 17.3h4.6l-1.2 7.2 6.9-9.9h-4.6z" fill="currentColor"/><path d="M8.6 8.6 23.4 23.4" stroke="#000" stroke-width="3.6"/><path d="M8.6 8.6 23.4 23.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="cam-ico" id="cam-chevron" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M9.5 19 16 12.6 22.5 19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="cam-ico" id="cam-live" aria-hidden="true">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="3.2" fill="currentColor"/><circle cx="16" cy="16" r="7.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="12.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="0.1 2.62" stroke-linecap="round"/><g class="live-slash"><path d="M6 6 26 26" stroke="#000" stroke-width="3.6"/><path d="M6 6 26 26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></g></svg>
          </div>
        </div>

        <div id="preview">
          <video id="video" playsinline muted autoplay disablepictureinpicture></video>
          <div id="overlay-fx">
            <div id="card-el"><canvas id="card-canvas"></canvas><div class="grain"></div></div>
          </div>
          <svg id="dbg-svg" hidden></svg>
          <div id="dbg-text" class="debug-badge" hidden></div>
          <div id="focus-box" hidden><i class="fb-sun"></i></div>
          <div id="ae-lock" hidden>VERROUILLAGE AE/AF</div>
          <div id="cam-zoom" aria-hidden="true">
            <svg class="zoom-arrows" viewBox="0 0 32 32"><path d="M18.5 8.5h5v5M23.5 8.5l-5.7 5.7M13.5 23.5h-5v-5M8.5 23.5l5.7-5.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="zoom-pill">1×</span>
          </div>
          <div id="shutter-flash"></div>
          <div id="cam-denied" hidden></div>
        </div>

        <div class="cam-modes"><div id="mode-track">
          <span>ACCÉLÉRÉ</span><span>RALENTI</span><span>CINÉMATIQUE</span><span>VIDÉO</span><span class="on">PHOTO</span><span>PORTRAIT</span>
        </div></div>

        <div class="cam-bottom">
          <div id="cam-thumb"><canvas id="thumb-canvas" width="138" height="138"></canvas></div>
          <div id="cam-shutter"><i></i></div>
          <div id="cam-flip">
            <svg viewBox="0 0 32 32"><path d="M9.2 13.2a7.4 7.4 0 0 1 13.3-2.7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="m23.9 7.2-.6 4.9-4.7-1.6z" fill="currentColor"/><path d="M22.8 18.8a7.4 7.4 0 0 1-13.3 2.7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="m8.1 24.8.6-4.9 4.7 1.6z" fill="currentColor"/></svg>
          </div>
        </div>

        <img id="cam-ref" src="assets/camera_ref.png" alt="" draggable="false" hidden>
        <div id="launch-icon"><img alt="" draggable="false"></div>
      </div>

      <div id="calib-bar" class="tool-bar" hidden>
        <button data-c="ghost">Opacité</button>
        <button data-c="reset">Défaut</button>
        <button data-c="cancel">Annuler</button>
        <button data-c="save" class="primary">Enregistrer</button>
      </div>
      <div id="calib-help" hidden>1 doigt : déplacer · 2 doigts : taille + rotation</div>
    </section>

    <!-- ============ Secret settings ============ -->
    <section id="settings" hidden></section>
  </div>

  <video id="keepawake" src="media/keepawake.mp4" playsinline muted loop hidden></video>
  <script type="module" src="js/app.js"></script>
</body>
</html>
